# 3. WooCommerce Service & Deployment in urumi-store
apiVersion: apps/v1
kind: Deployment
metadata:
  name: woo-mcp
  namespace: urumi-store
  labels:
    app: woo-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: woo-mcp
  template:
    metadata:
      labels:
        app: woo-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: woo-mcp
          image: urumi/woo-mcp:dev-v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: mcp
          env:
            - name: PORT
              value: "3001"
            - name: WC_STORE_URL
              valueFrom:
                secretKeyRef:
                  name: woo-api-keys
                  key: WC_STORE_URL
            - name: WC_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: woo-api-keys
                  key: WC_CONSUMER_KEY
            - name: WC_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: woo-api-keys
                  key: WC_CONSUMER_SECRET
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: woo-mcp
  namespace: urumi-store
spec:
  selector:
    app: woo-mcp
  ports:
    - port: 3001
      targetPort: 3001
      name: mcp
