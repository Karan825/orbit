# 1. Fulfillment Service & Deployment in mcp-upstreams
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fulfillment-mcp
  namespace: mcp-upstreams
  labels:
    app: fulfillment-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fulfillment-mcp
  template:
    metadata:
      labels:
        app: fulfillment-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: fulfillment
          image: urumi/fulfillment-mcp:dev-v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
              name: mcp
          env:
            - name: PORT
              value: "3002"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3002
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fulfillment-mcp
  namespace: mcp-upstreams
spec:
  selector:
    app: fulfillment-mcp
  ports:
    - port: 3002
      targetPort: 3002
      name: mcp
---
