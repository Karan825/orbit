apiVersion: apps/v1
kind: Deployment
metadata:
  name: fulfillment-mcp
  namespace: {{ .Values.namespaces.upstreams }}
  labels:
    app: fulfillment-mcp
    {{- include "mcp-gateway.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fulfillment-mcp
  template:
    metadata:
      labels:
        app: fulfillment-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: fulfillment
          image: "{{ .Values.upstreams.fulfillment.image.repository }}:{{ .Values.upstreams.fulfillment.image.tag }}"
          imagePullPolicy: {{ .Values.upstreams.fulfillment.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.upstreams.fulfillment.port }}
              name: mcp
          env:
            - name: PORT
              value: "{{ .Values.upstreams.fulfillment.port }}"
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.upstreams.fulfillment.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.upstreams.fulfillment.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.upstreams.fulfillment.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: fulfillment-mcp
  namespace: {{ .Values.namespaces.upstreams }}
  labels:
    app: fulfillment-mcp
spec:
  selector:
    app: fulfillment-mcp
  ports:
    - port: {{ .Values.upstreams.fulfillment.port }}
      targetPort: {{ .Values.upstreams.fulfillment.port }}
      name: mcp
---
