apiVersion: apps/v1
kind: Deployment
metadata:
  name: woo-mcp
  namespace: {{ .Values.namespaces.store }}
  labels:
    app: woo-mcp
    {{- include "mcp-gateway.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: woo-mcp
  template:
    metadata:
      labels:
        app: woo-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: woo-mcp
          image: "{{ .Values.upstreams.woocommerce.image.repository }}:{{ .Values.upstreams.woocommerce.image.tag }}"
          imagePullPolicy: {{ .Values.upstreams.woocommerce.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.upstreams.woocommerce.port }}
              name: mcp
          env:
            - name: PORT
              value: "{{ .Values.upstreams.woocommerce.port }}"
            - name: WC_STORE_URL
              valueFrom:
                secretKeyRef:
                  name: woo-api-keys
                  key: WC_STORE_URL
            - name: WC_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: woo-api-keys
                  key: WC_CONSUMER_KEY
            - name: WC_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: woo-api-keys
                  key: WC_CONSUMER_SECRET
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.upstreams.woocommerce.port }}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.upstreams.woocommerce.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.upstreams.woocommerce.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: woo-mcp
  namespace: {{ .Values.namespaces.store }}
  labels:
    app: woo-mcp
spec:
  selector:
    app: woo-mcp
  ports:
    - port: {{ .Values.upstreams.woocommerce.port }}
      targetPort: {{ .Values.upstreams.woocommerce.port }}
      name: mcp