apiVersion: apps/v1
kind: Deployment
metadata:
  name: urumi-gateway
  namespace: {{ .Values.namespaces.platform }}
  labels:
    app: urumi-gateway
    {{- include "mcp-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app: urumi-gateway
  template:
    metadata:
      labels:
        app: urumi-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.gateway.service.port }}
              name: http
          env:
            - name: PORT
              value: "{{ .Values.gateway.service.port }}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: platform-db
                  key: DATABASE_URL
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-llm
                  key: GEMINI_API_KEY
            - name: WOOCOMMERCE_MCP_URL
              value: "http://woo-mcp.{{ .Values.namespaces.store }}.svc.{{ .Values.global.clusterDomain }}:3001/mcp"
            - name: FULFILLMENT_MCP_URL
              value: "http://fulfillment-mcp.{{ .Values.namespaces.upstreams }}.svc.{{ .Values.global.clusterDomain }}:3002/mcp"
            - name: SUPPLIER_MCP_URL
              value: "http://supplier-mcp.{{ .Values.namespaces.upstreams }}.svc.{{ .Values.global.clusterDomain }}:3003/mcp"
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.gateway.service.port }}
            initialDelaySeconds: {{ .Values.gateway.probes.initialDelaySeconds }}
            periodSeconds: {{ .Values.gateway.probes.periodSeconds }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.gateway.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: urumi-gateway
  namespace: {{ .Values.namespaces.platform }}
  labels:
    app: urumi-gateway
    {{- include "mcp-gateway.labels" . | nindent 4 }}
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    app: urumi-gateway
  ports:
    - port: {{ .Values.gateway.service.port }}
      targetPort: {{ .Values.gateway.service.port }}
      name: http